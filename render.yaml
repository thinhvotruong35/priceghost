# render.yaml — Render.com deployment configuration for PriceGhost
# Deploy both backend and frontend services with one click
# Docs: https://render.com/docs/blueprint-spec

services:
  # ──────────────────────────────────────
  # BACKEND (Node.js / Express / TypeScript)
  # ──────────────────────────────────────
  - type: web
    name: priceghost-backend
    runtime: node
    region: singapore          # Closest region to Vietnam
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx puppeteer browsers install chrome && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/auth/registration-status
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # ---- Copy these from your Neon.tech dashboard ----
      - key: DATABASE_URL
        sync: false            # You must set this manually in Render dashboard
      # ---- Generate a strong random string (e.g. openssl rand -base64 32) ----
      - key: JWT_SECRET
        generateValue: true
      # ---- Optional: Enable Puppeteer on Render ----
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: 'false'
      - key: PUPPETEER_EXECUTABLE_PATH
        value: '/usr/bin/google-chrome-stable'

  # ──────────────────────────────────────
  # FRONTEND (React / Vite — Static Site)
  # ──────────────────────────────────────
  - type: web
    name: priceghost-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # Replace with your actual backend URL after first deploy
        value: https://priceghost-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — redirect all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
